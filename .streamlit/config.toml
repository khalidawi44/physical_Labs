# Configuration Streamlit livrée avec la cartographie Alliance Groupe.
# Elle s'applique automatiquement quand l'outil est lancé depuis ce dossier.

[server]
# Ouvre le navigateur automatiquement au lancement.
headless = false
# Supprime l'invite « Email: » que Streamlit affiche au tout premier lancement
# sur une machine neuve (elle bloquait la console en attendant une saisie).
showEmailPrompt = false
# N'écoute que sur la machine locale : l'outil n'est pas visible depuis les
# autres postes du réseau.
address = "localhost"
port = 8501
# Taille maximale (en Mo) d'un fichier téléversé par le navigateur.
# Au-delà, utiliser le mode « chemin local » de la barre latérale, sans limite.
maxUploadSize = 4096

[browser]
# Aucune statistique d'usage envoyée à Streamlit.
gatherUsageStats = false

[logger]
# Supprime le message de bienvenue et, avec lui, la fenêtre « Installez les
# compétences Streamlit pour les agents IA » qui s'affichait au chercheur.
hideWelcomeMessage = true

[client]
# Barre d'outils « lecteur » : pas de bouton Déployer ni d'options de développeur.
toolbarMode = "viewer"
